[project]
name = "field-mapper"
version = "0.1.0"
description = "AI-powered data dictionary generator for city transportation datasets"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "streamlit",
    "pandas",
    "python-dotenv",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
